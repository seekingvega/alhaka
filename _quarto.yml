project:
  type: website
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!CLAUDE.md"
    - "!design.md"

website:
  title: "Alpaca Hackathon Knowledge Agent"
  site-url: https://seekingvega.github.io/alhaka
  llms-txt: true
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/seekingvega/alhaka
format:
  html:
    # Themes are rendered from design.tokens.json; see design.md. Edit the JSON, not the theme-*.scss files.
    theme:
      light: [cosmo, theme-light.scss, site.scss]
      dark: [cosmo, theme-dark.scss, site.scss]
    css: styles.css
    include-in-header:
      - text: |
          <script>window.goatcounter = { path: function(p) { return location.host + p; } };</script>
          <script data-goatcounter="https://jho.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
